<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Stats · Gerardo Barberena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="stats.css" />
</head>
<body>
  <header class="bar">
    <a href="/" class="back" aria-label="Back to site">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>gerardobarberena.com</span>
    </a>
    <span class="bar-title mono">analytics</span>
    <div class="bar-actions">
      <select id="range" aria-label="Range">
        <option value="7">last 7 days</option>
        <option value="30" selected>last 30 days</option>
        <option value="90">last 90 days</option>
        <option value="365">last 12 months</option>
        <option value="all">all time</option>
      </select>
      <button id="logout" class="ghost-btn" hidden>Sign out</button>
    </div>
  </header>

  <main>
    <!-- Login view -->
    <section id="login" class="login-card">
      <h1>Sign in to view stats</h1>
      <p>A magic link will be sent to the admin email. Only that mailbox can sign in.</p>
      <form id="login-form">
        <input type="email" id="email" required placeholder="gerardo.barberena@icloud.com" autocomplete="email" />
        <button type="submit" class="primary-btn">Send magic link</button>
      </form>
      <p id="login-msg" class="login-msg" role="status" aria-live="polite"></p>
    </section>

    <!-- Dashboard view -->
    <section id="dashboard" hidden>
      <div class="kpis">
        <div class="kpi">
          <span class="kpi-label">Total visits</span>
          <span class="kpi-value" id="kpi-total">—</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">Today</span>
          <span class="kpi-value" id="kpi-today">—</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">Unique countries</span>
          <span class="kpi-value" id="kpi-countries">—</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">Languages</span>
          <span class="kpi-value" id="kpi-langs">—</span>
        </div>
      </div>

      <div class="grid">
        <article class="panel panel-wide">
          <h2>Visits per day</h2>
          <div class="chart-wrap"><canvas id="chart-daily"></canvas></div>
        </article>

        <article class="panel">
          <h2>Top countries</h2>
          <div class="chart-wrap"><canvas id="chart-countries"></canvas></div>
        </article>

        <article class="panel">
          <h2>Language</h2>
          <div class="chart-wrap"><canvas id="chart-langs"></canvas></div>
        </article>

        <article class="panel">
          <h2>Device</h2>
          <div class="chart-wrap"><canvas id="chart-devices"></canvas></div>
        </article>

        <article class="panel">
          <h2>Top pages</h2>
          <ol id="list-paths" class="list"></ol>
        </article>

        <article class="panel">
          <h2>Top referrers</h2>
          <ol id="list-referrers" class="list"></ol>
        </article>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../supabase-config.js"></script>
  <script src="stats.js"></script>
</body>
</html>
